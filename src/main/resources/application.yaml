spring:
  application.name: game-server
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_NAME}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate.ddl-auto: none
  lifecycle:
    timeout-per-shutdown-phase: 10s
  profiles:
    default: development
server:
  port: ${PORT:8082}
  shutdown: graceful

mailgun:
  api-key: ${MAILGUN_API_KEY:}
  domain: ${MAILGUN_DOMAIN:accounts.codenzasoft.ca}
  from: ${MAILGUN_FROM:noreply@accounts.codenzasoft.ca}

management.endpoint:
  info.enabled: true
  beans.enabled: true

---
spring.config.activate.on-profile: development

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/postgres
    username: postgres
    password: postgres
  thymeleaf:
    cache: false

logging.level.org.springframework.messaging.simp: DEBUG

---
spring.config.activate.on-profile: env-development

---
spring.config.activate.on-profile: cloud

server:
  forward-headers-strategy: native

spring:
  datasource:
    url: "jdbc:postgresql:///${POSTGRES_NAME}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=crafty-dynamics-495319-e2:us-central1:codenza-games-db"
