<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
    <head th:replace="~{fragments/links :: head-js-css}"></head>
    <body>
        <div class="position-absolute top-50 start-50 translate-middle">
            <img src="/img/codenza-logo.png" width="300" class="mb-5"/>
            <h5 class="mb-3">Create your account</h5>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/register}" method="post" autocomplete="off">
                <div class="row mb-3">
                    <input type="email" name="email" placeholder="Email"
                           th:value="${email}" required/>
                </div>
                <div class="row mb-3">
                    <input type="text" name="userName" placeholder="Username"
                           th:value="${userName}" required/>
                </div>
                <div class="row mb-3">
                    <input type="password" name="password" placeholder="Password" required/>
                </div>
                <div class="row mb-3">
                    <input type="password" name="confirmPassword"
                           placeholder="Confirm password" required/>
                </div>
                <div class="row mb-3">
                    <input class="btn btn-primary" type="submit" value="Create account"/>
                </div>
            </form>
            <div class="row mt-3">
                <small class="text-muted">
                    Already have an account?
                    <a th:href="@{/login}">Sign in</a>
                </small>
            </div>
        </div>
    </body>
</html>
