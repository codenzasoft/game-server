<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/links :: head-js-css}"></head>
    <style>
        .game-row-kh {
            background-image: linear-gradient(rgba(255,255,255,0.78), rgba(255,255,255,0.78)),
                              url('/img/kingshand-bg.png');
            background-size: cover;
            background-position: center top;
        }
        .game-row-xo {
            background-image: linear-gradient(rgba(255,255,255,0.78), rgba(255,255,255,0.78)),
                              url('/img/xo-bg.png');
            background-size: cover;
            background-position: center;
        }
        .game-row-hearts {
            background-image: linear-gradient(rgba(255,255,255,0.78), rgba(255,255,255,0.78)),
                              url('/img/hearts-bg.png');
            background-size: cover;
            background-position: center;
        }
    </style>
    <body>
        <div th:replace="~{fragments/header :: header}">&nbsp;</div>
        <main class="container mt-4">
            <h2>Games</h2>

            <!-- Active games -->
            <section class="mb-4" th:if="${not #lists.isEmpty(activeGames)}">
                <h5>Active Games</h5>
                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center"
                        th:each="game : ${activeGames}"
                        th:classappend="${game.gameType.name() == 'KH' ? 'game-row-kh' : game.gameType.name() == 'HEARTS' ? 'game-row-hearts' : 'game-row-xo'}">
                        <div>
                            <span class="fw-semibold"
                                  th:text="${helper.getGameTypeName(game)}"></span>
                            <span class="text-muted mx-1">&mdash;</span>
                            <span th:text="${helper.getGamePlayersDescription(game.players)}"></span>
                            <br>
                            <small class="text-muted"
                                   th:text="${#dates.format(game.createdAt, 'MMM d, yyyy h:mm a')}"></small>
                        </div>
                        <div class="d-flex gap-2 align-items-center">
                            <a th:href="${helper.getGameUrl(game)}"
                               class="btn btn-primary btn-sm">Join</a>
                            <form th:id="'delete-form-' + ${game.id}"
                                  th:action="@{/games/{id}/delete(id=${game.id})}" method="post">
                                <button type="button" class="btn btn-danger btn-sm"
                                        title="Delete game"
                                        data-bs-toggle="modal"
                                        data-bs-target="#confirmDeleteModal"
                                        th:data-form-id="'delete-form-' + ${game.id}">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </li>
                </ul>
            </section>

            <!-- Game limit notice -->
            <div class="alert alert-warning" role="alert" th:if="${atGameLimit}">
                You have reached the limit of <strong th:text="${@gameService.MAX_ACTIVE_GAMES}">10</strong>
                active games. Finish or quit an existing game to start a new one.
            </div>

            <!-- New King's Hand game -->
            <section class="mb-3">
                <h5>King's Hand</h5>
                <div class="d-flex gap-2 flex-wrap">
                    <form th:action="@{/games/kh}" method="post">
                        <button type="submit" class="btn btn-warning"
                                th:disabled="${atGameLimit}">
                            Play King's Hand
                        </button>
                    </form>
                </div>
            </section>

            <!-- New Hearts game -->
            <section class="mb-3">
                <h5>Hearts</h5>
                <div class="d-flex gap-2 flex-wrap">
                    <form th:action="@{/games/hearts}" method="post">
                        <button type="submit" class="btn btn-danger"
                                th:disabled="${atGameLimit}">Play vs Bots</button>
                    </form>
                </div>
            </section>

            <!-- New vs-bot game -->
            <section class="mb-3">
                <h5>Xs &amp; Os</h5>
                <div class="d-flex gap-2 flex-wrap">
                    <form th:action="@{/games/xo}" method="post">
                        <button type="submit" class="btn btn-primary"
                                th:disabled="${atGameLimit}">Play vs Bot</button>
                    </form>
                    <form th:action="@{/games/xo/challenge}" method="post"
                          class="d-flex gap-2 align-items-center"
                          th:if="${not #lists.isEmpty(opponents)}">
                        <select name="opponentId" class="form-select form-select-sm"
                                th:disabled="${atGameLimit}" required>
                            <option value="" disabled selected>Select opponent…</option>
                            <option th:each="u : ${opponents}"
                                    th:value="${u.id}"
                                    th:text="${u.username}"></option>
                        </select>
                        <button type="submit" class="btn btn-outline-primary"
                                th:disabled="${atGameLimit}">Challenge</button>
                    </form>
                </div>
            </section>
        </main>
        <div th:replace="~{fragments/footer :: footer}">&nbsp;</div>

        <!-- Delete confirmation modal -->
        <div class="modal fade" id="confirmDeleteModal" tabindex="-1"
             aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="confirmDeleteModalLabel">
                            <i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>
                            Delete game?
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Are you sure you want to delete this game?
                        <strong>This cannot be undone.</strong>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger"
                                id="confirmDeleteBtn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            (function () {
                const modal = document.getElementById('confirmDeleteModal');
                const confirmBtn = document.getElementById('confirmDeleteBtn');
                let pendingFormId = null;

                modal.addEventListener('show.bs.modal', function (event) {
                    pendingFormId = event.relatedTarget.dataset.formId;
                });

                confirmBtn.addEventListener('click', function () {
                    if (pendingFormId) {
                        document.getElementById(pendingFormId).submit();
                    }
                });
            })();
        </script>
    </body>
</html>
