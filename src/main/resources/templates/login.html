<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
    <head th:replace="~{fragments/links :: head-js-css}"></head>
    <body>
        <div class="position-absolute top-50 start-50 translate-middle">
            <img src="/img/codenza-sdi-tech-banner.png" width="300" class="mb-5"/>
            <div class="row g-3">
                <div th:if="${param.error}">
                    Invalid username and password.
                </div>
                <div th:if="${param.logout}">
                    You have been logged out.
                </div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            </div>
            <div class="row">
                <form th:action="@{/login}" method="post">
                    <div class="row mb-3">
                        <input type="text" name="username" placeholder="Username or email"/>
                    </div>
                    <div class="row mb-3">
                        <input type="password" name="password" placeholder="Password"/>
                    </div>
                    <div class="row mb-3">
                        <input class="btn btn-primary" type="submit" value="Sign in" />
                    </div>
                </form>
            </div>
            <div class="row mt-3">
                <small class="text-muted">
                    Don't have an account?
                    <a th:href="@{/register}">Create one</a>
                </small>
            </div>
            <div class="row mt-2">
                <small class="text-muted">
                    <a th:href="@{/forgot-password}">Forgot your password?</a>
                </small>
            </div>
            <div class="row mt-2">
                <small class="text-muted">
                    <a th:href="@{/verify-email/resend}">Resend verification email</a>
                </small>
            </div>
        </div>
    </body>
</html>
