<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
    <head th:replace="~{fragments/links :: head-js-css}"></head>
    <body>
        <div class="position-absolute top-50 start-50 translate-middle">
            <img src="/img/codenza-logo.png" width="300" class="mb-5"/>
            <h5 class="mb-3">Choose a new password</h5>
            <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
            <div th:if="${token}">
                <form th:action="@{/reset-password}" method="post">
                    <input type="hidden" name="token" th:value="${token}"/>
                    <div class="row mb-3">
                        <input type="password" name="newPassword" placeholder="New password"
                               autocomplete="new-password" minlength="12" maxlength="64" required/>
                    </div>
                    <div class="row mb-3">
                        <input type="password" name="confirmPassword" placeholder="Confirm new password"
                               autocomplete="new-password" minlength="12" maxlength="64" required/>
                    </div>
                    <div class="row mb-3">
                        <input class="btn btn-primary" type="submit" value="Reset password"/>
                    </div>
                </form>
            </div>
            <div th:unless="${token}">
                <p class="text-muted">
                    <a th:href="@{/forgot-password}">Request a new reset link</a>
                </p>
            </div>
            <div class="row mt-3">
                <small class="text-muted">
                    <a th:href="@{/login}">Back to sign in</a>
                </small>
            </div>
        </div>
    </body>
</html>
