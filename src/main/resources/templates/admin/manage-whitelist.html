<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/links :: head-js-css}"></head>
    <body>
        <div th:replace="~{fragments/header :: header}">&nbsp;</div>
        <div class="container mt-4">
            <h4 class="mb-4">Manage Whitelist</h4>
            <p class="text-muted small">
                Emails on this list are permitted to create an account. The role assigned here
                will be granted to the user when they register. Once a whitelisted user creates
                an account, their entry is removed.
            </p>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/admin/whitelist/add}" method="post" class="row g-2 mb-4">
                <div class="col-md-5">
                    <input type="email" name="email" class="form-control"
                           placeholder="user@example.com" required/>
                </div>
                <div class="col-md-3">
                    <select name="role" class="form-select">
                        <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.name()}"
                                th:selected="${r.name() == 'USER'}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Add to Whitelist</button>
                </div>
            </form>

            <form th:action="@{/admin/whitelist/remove}" method="post" id="whitelistForm">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="text-muted small"
                          th:text="${entries.numberOfElements + ' of ' + entries.totalElements + ' entries'}"></span>
                    <button type="submit" class="btn btn-danger btn-sm">Remove Selected</button>
                </div>
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th style="width:2.5rem"><input type="checkbox" id="selectAll"/></th>
                            <th>
                                <a class="text-decoration-none text-dark"
                                   th:href="@{/admin/whitelist(page=0,sort='email',dir=${sort == 'email' && dir == 'asc' ? 'desc' : 'asc'})}">
                                    Email
                                    <span th:if="${sort == 'email'}" th:text="${dir == 'asc' ? '↑' : '↓'}"></span>
                                </a>
                            </th>
                            <th>
                                <a class="text-decoration-none text-dark"
                                   th:href="@{/admin/whitelist(page=0,sort='role',dir=${sort == 'role' && dir == 'asc' ? 'desc' : 'asc'})}">
                                    Role
                                    <span th:if="${sort == 'role'}" th:text="${dir == 'asc' ? '↑' : '↓'}"></span>
                                </a>
                            </th>
                            <th>
                                <a class="text-decoration-none text-dark"
                                   th:href="@{/admin/whitelist(page=0,sort='createdAt',dir=${sort == 'createdAt' && dir == 'asc' ? 'desc' : 'asc'})}">
                                    Added
                                    <span th:if="${sort == 'createdAt'}" th:text="${dir == 'asc' ? '↑' : '↓'}"></span>
                                </a>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${entries.content}">
                            <td>
                                <input type="checkbox" name="emails" th:value="${e.email}"/>
                            </td>
                            <td th:text="${e.email}"></td>
                            <td>
                                <span class="badge bg-secondary" th:text="${e.role.name()}"></span>
                            </td>
                            <td th:text="${#dates.format(e.createdAt, 'yyyy-MM-dd')}"></td>
                        </tr>
                        <tr th:if="${entries.totalElements == 0}">
                            <td colspan="4" class="text-muted text-center py-4">
                                No whitelist entries yet. Add one above.
                            </td>
                        </tr>
                    </tbody>
                </table>
                <nav th:if="${entries.totalPages > 1}">
                    <ul class="pagination pagination-sm">
                        <li class="page-item" th:classappend="${entries.first ? 'disabled' : ''}">
                            <a class="page-link"
                               th:href="@{/admin/whitelist(page=${entries.number - 1},sort=${sort},dir=${dir})}">Previous</a>
                        </li>
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, entries.totalPages - 1)}"
                            th:classappend="${i == entries.number ? 'active' : ''}">
                            <a class="page-link"
                               th:href="@{/admin/whitelist(page=${i},sort=${sort},dir=${dir})}"
                               th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${entries.last ? 'disabled' : ''}">
                            <a class="page-link"
                               th:href="@{/admin/whitelist(page=${entries.number + 1},sort=${sort},dir=${dir})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </form>
        </div>
        <div th:replace="~{fragments/footer :: footer}">&nbsp;</div>
        <script>
            const selectAll = document.getElementById('selectAll');
            const checkboxes = () => document.querySelectorAll('input[name="emails"]');

            selectAll.addEventListener('change', () =>
                checkboxes().forEach(cb => cb.checked = selectAll.checked));

            checkboxes().forEach(cb => cb.addEventListener('change', () => {
                const all = checkboxes();
                selectAll.checked = all.length > 0 && [...all].every(c => c.checked);
            }));

            document.getElementById('whitelistForm').addEventListener('submit', e => {
                if (!document.querySelector('input[name="emails"]:checked')) {
                    e.preventDefault();
                    alert('Select at least one entry to remove.');
                }
            });
        </script>
    </body>
</html>
