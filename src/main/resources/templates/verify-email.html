<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
    <head th:replace="~{fragments/links :: head-js-css}"></head>
    <body>
        <div class="position-absolute top-50 start-50 translate-middle text-center">
            <img src="/img/codenza-logo.png" width="300" class="mb-5"/>
            <div th:if="${verified}">
                <h5 class="mb-3">Email verified!</h5>
                <p class="text-muted mb-3">Your account is now active. You can sign in.</p>
                <a th:href="@{/login}" class="btn btn-primary">Sign in</a>
            </div>
            <div th:unless="${verified}">
                <h5 class="mb-3">Email verification</h5>
                <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
                <p class="text-muted">
                    <a th:href="@{/verify-email/resend}">Request a new verification link</a>
                </p>
            </div>
            <div class="row mt-4">
                <small class="text-muted">
                    <a th:href="@{/login}">Back to sign in</a>
                </small>
            </div>
        </div>
    </body>
</html>
