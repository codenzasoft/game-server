plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.codenzasoft'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

configurations {
    newrelic
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(
            'com.codenzasoft.games:game-common:1.0.0',
            'com.codenzasoft.games:game-hearts:1.0.0',
    )
    implementation(
            'org.springframework.boot:spring-boot-starter-security',
            'org.springframework.boot:spring-boot-starter-data-jpa',
            'org.springframework.boot:spring-boot-starter-thymeleaf',
            'org.thymeleaf.extras:thymeleaf-extras-springsecurity6',
            'jakarta.persistence:jakarta.persistence-api',
            'org.springframework.boot:spring-boot-starter-web',
            'org.springframework.boot:spring-boot-starter-actuator',
            'org.springframework.boot:spring-boot-starter-websocket',
            'org.springframework.session:spring-session-jdbc',
            'org.postgresql:postgresql',
            'com.google.cloud.sql:postgres-socket-factory:1.21.0',
            'com.newrelic.agent.java:newrelic-api:9.2.0',
    )

    newrelic 'com.newrelic.agent.java:newrelic-agent:9.2.0'

    testImplementation(
            'junit:junit:4.13.2',
            'org.spockframework:spock-core:2.4-M7-groovy-5.0',
            'org.spockframework:spock-spring:2.4-M7-groovy-5.0',
            'org.springframework.boot:spring-boot-starter-test',
            'org.springframework.security:spring-security-test',
            'org.flywaydb:flyway-core',
            'org.flywaydb:flyway-database-postgresql',
    )
}

spotless {
    java {
        googleJavaFormat()
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.register('copyNewRelicAgent', Copy) {
    from configurations.newrelic
    into layout.buildDirectory.dir('newrelic')
    rename { 'newrelic.jar' }
}

bootJar.dependsOn copyNewRelicAgent

compileJava.dependsOn('spotlessApply')

node {
    version = '22.11.0'
    download = true
    nodeProjectDir = file('ui')
}

tasks.register('cleanFrontend', Delete) {
    delete 'ui/dist'
}
clean.dependsOn('cleanFrontend')

tasks.register('buildFrontend', NpmTask) {
    dependsOn npmInstall
    def viteMode = project.findProperty('viteMode') ?: 'development'
    args = ['run', 'build:gradle', '--', '--mode', viteMode]
    inputs.dir('ui/src')
    inputs.files('ui/package.json', 'ui/package-lock.json', 'ui/tsconfig.json', 'ui/vite.config.ts')
    inputs.property('viteMode', viteMode)
    outputs.dir('ui/dist')
}

processResources {
    dependsOn buildFrontend
    from('ui/dist') {
        into('static')
    }
}
