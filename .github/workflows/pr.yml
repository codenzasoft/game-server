name: PR Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: game-server

      - uses: actions/checkout@v4
        with:
          repository: codenzasoft/game-database
          path: game-database

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: game-server
        run: ./gradlew build
